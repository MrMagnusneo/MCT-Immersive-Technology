name: NeoForge 1.21.1 build

on:
  push:
    branches:
      - codex/neoforge-1.21.1-build
  pull_request:
    branches:
      - 1.21.1-3.0-Dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify content manifest
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/content_manifest.py --check src/test/resources/baseline-content-manifest.json
          cp version.properties "$RUNNER_TEMP/version.properties"

      - name: Run data generators
        run: ./gradlew runData --stacktrace

      - name: Verify generated content
        run: |
          git diff -- src/generated/resources/assets/immersivetechnology/models/multiblock/metal/split/boiler_solid_active_split.json
          git diff -- src/generated/resources/assets/immersivetechnology/models/multiblock/metal/split/boiler_solid_split.json
          python3 scripts/content_manifest.py --check src/test/resources/baseline-content-manifest.json
          git diff --exit-code -- src/main src/generated

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Verify gameplay JAR
        id: gameplay-jar
        shell: bash
        run: |
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'MCT-ImmersiveTechnology-1.21.1-*.jar' ! -name '*-sources.jar' ! -name '*-datagen.jar')
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one gameplay JAR, found ${#jars[@]}"
            printf '%s\n' "${jars[@]}"
            exit 1
          fi
          python3 scripts/verify_jar.py "${jars[0]}"
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test dedicated server
        run: scripts/ci/server_smoke.sh

      - name: Verify immutable build version
        run: |
          cmp version.properties "$RUNNER_TEMP/version.properties"
          git diff --exit-code -- version.properties

      - name: Upload gameplay JAR
        uses: actions/upload-artifact@v4
        with:
          name: mct-immersive-technology-neoforge-1.21.1
          path: ${{ steps.gameplay-jar.outputs.path }}
          if-no-files-found: error
