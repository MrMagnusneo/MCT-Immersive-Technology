name: NeoForge 1.21.1 build

on:
  push:
    branches:
      - codex/neoforge-1.21.1-build
  pull_request:
    branches:
      - 1.21.1-3.0-Dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify content manifest
        run: |
          python3 -m unittest scripts.tests.test_content_manifest -v
          python3 scripts/content_manifest.py --check src/test/resources/baseline-content-manifest.json

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Upload gameplay JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mct-immersive-technology-neoforge-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-datagen.jar
          if-no-files-found: warn
